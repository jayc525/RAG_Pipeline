[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jay525", email = "jaychakkarwar1234@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "typesense>=2.1.0",
]

[project.scripts]
rag-pipeline = "rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
